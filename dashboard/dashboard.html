<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herbaryo | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dashboard.css">
    <link rel="stylesheet" href="../main/motion.css">
</head>

<body>
    <header class="dashboard-header">
        <div class="container">
            <nav class="dashboard-nav">
                <div class="logo">
                    <a href="#" class="logo-link">
                        <h2>DASHBOARD</h2>
                    </a>
                </div>
                <div class="dashboard-tools">
                    <button class="dashboard-menu-toggle" id="dashboardMenuBtn" type="button"
                        aria-label="Open dashboard menu" aria-controls="dashboardActions" aria-expanded="false">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div class="dashboard-actions" id="dashboardActions">
                        <button class="edit-btn" id="editBtn">Edit</button>
                        <button class="admin-btn" id="adminBtn">Admin</button>
                        <button class="logout-btn" id="logoutBtn">Logout</button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="dashboard-hero">
            <div class="hero-avatar" id="userAvatar" aria-hidden="true">H</div>
            <h1 id="welcomeText">Greetings, Herbalist</h1>
        </section>

        <section class="dashboard-section personal-section">
            <div class="section-heading section-heading-row">
                <div class="section-heading-title">
                    <h2>Personal Info</h2>
                    <button class="section-toggle" type="button" data-section-toggle="personalInfoContent"
                        data-section-name="Personal Info" aria-expanded="true" aria-label="Hide Personal Info"
                        aria-controls="personalInfoContent" title="Hide Personal Info">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                            <circle cx="12" cy="12" r="3" />
                            <path class="toggle-eye-slash" d="m4 4 16 16" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="personal-grid section-content" id="personalInfoContent">
                <div class="info-item">
                    <span>Username</span>
                    <strong id="usernameValue">Herbalist</strong>
                </div>
                <div class="info-item">
                    <span>Email</span>
                    <strong id="userEmail">-</strong>
                </div>
                <div class="info-item">
                    <span>Account Type</span>
                    <strong id="accountTypeValue">Free</strong>
                </div>
            </div>
        </section>

        <section class="dashboard-section achievements-section">
            <div class="section-heading section-heading-row">
                <div class="section-heading-title">
                    <h2>Achievements</h2>
                    <button class="section-toggle" type="button" data-section-toggle="accountAchievementsContent"
                        data-section-name="Achievements" aria-expanded="true"
                        aria-label="Hide Achievements" aria-controls="accountAchievementsContent"
                        title="Hide Achievements">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                            <circle cx="12" cy="12" r="3" />
                            <path class="toggle-eye-slash" d="m4 4 16 16" />
                        </svg>
                    </button>
                </div>
                <strong class="mastery-total" id="achievementCount">0/11</strong>
            </div>
            <div class="section-content" id="accountAchievementsContent">
                <div class="achievement-grid" id="achievementList"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Herbaryo - Thesis Game by Real's Group. Preserving Philippine herbal knowledge through
                gamification.</p>
        </div>
    </footer>
    <button class="feedback-button" type="button" aria-label="Give feedback" title="Give feedback">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-5.5A7.5 7.5 0 1 1 20 11.5Z" />
            <path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01" />
        </svg>
    </button>

    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script defer src="../main/database-schema.js"></script>
    <script defer src="./dashboard.js"></script>
</body>

</html>
