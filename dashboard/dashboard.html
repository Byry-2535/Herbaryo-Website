<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herbaryo | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./dashboard.css">
</head>

<body>
    <header class="dashboard-header">
        <div class="container">
            <nav class="dashboard-nav">
                <div class="logo">
                    <a href="#" class="logo-link">
                        <h2>HERBARYO</h2>
                    </a>
                </div>
                <div class="nav-wallet" aria-label="Wallet balance">
                    <div class="nav-resource aurels">
                        <span>Aurels</span>
                        <strong id="aurelsCount">0</strong>
                    </div>
                    <div class="nav-resource aetherion">
                        <span>Aetherion</span>
                        <strong id="aetherionCount">0</strong>
                    </div>
                </div>
                <div class="dashboard-actions">
                    <button class="admin-btn" id="adminBtn">Admin</button>
                    <button class="edit-btn" id="editBtn">Edit</button>
                    <button class="logout-btn" id="logoutBtn">Logout</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="dashboard-hero">
            <div class="hero-avatar" id="userAvatar" aria-hidden="true">H</div>
            <div>
                <h1 id="welcomeText">Good morning, Herbalist</h1>
            </div>
        </section>

        <section class="dashboard-section personal-section">
            <div class="section-heading">
                <h2>Personal Info</h2>
            </div>
            <div class="personal-grid">
                <div class="info-item">
                    <span>Username</span>
                    <strong id="usernameValue">Herbalist</strong>
                </div>
                <div class="info-item">
                    <span>Email</span>
                    <strong id="userEmail">-</strong>
                </div>
                <div class="info-item">
                    <span>Gender</span>
                    <strong id="genderText">Not specified</strong>
                </div>
            </div>
        </section>

        <section class="dashboard-section">
            <div class="section-heading section-heading-row">
                <div>
                    <h2>Herbs Mastered</h2>
                </div>
                <strong class="mastery-total" id="herbsMasteredCount">0/10</strong>
            </div>
            <div class="herbs-list" id="herbsList"></div>
        </section>

        <section class="dashboard-section">
            <div class="section-heading">
                <h2>Achievements</h2>
            </div>
            <div class="achievement-grid" id="achievementList"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Herbaryo - Thesis Game by Real's Group. Preserving Philippine herbal knowledge through
                gamification.</p>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="./dashboard.js"></script>
</body>

</html>
