<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herbaryo | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./admin.css">
</head>

<body>
    <header class="admin-header">
        <div class="container">
            <div class="logo">
                <div class="logo-link" id="scrollToTop" aria-label="Admin page">
                    <h2>ADMIN</h2>
                </div>
            </div>
            <div class="admin-user">
                <button class="admin-menu-toggle" id="adminMenuBtn" type="button" aria-label="Open admin menu"
                    aria-controls="adminActions" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="admin-actions" id="adminActions">
                    <a href="../dashboard/dashboard.html" class="dashboard-btn">Dashboard</a>
                    <button class="logout-btn" id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="admin-stats">
            <h2>Total Players</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">Registered</div>
                </div>
            </div>
        </section>

        <section class="users-section">
            <h2>Manage Players</h2>
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="🔍 Search players by name or email...">
            </div>
            <div class="table-container">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Herbs Mastered</th>
                            <th>Achievements</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5">Loading players...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Herbaryo - Thesis Game by Real's Group. Preserving Philippine herbal knowledge through
                gamification.</p>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="../database-schema.js"></script>
    <script src="./admin.js"></script>
</body>

</html>
